#
# Build corCep against the cor stack and run its functional tests against a coraine container.
#
# Two containers on the runner's network, as `make functest` does on a workstation:
#   - the broker: a released coraine image (test/funcTests/broker.sh - ramDB, the tests isolate by tenant)
#   - the build and the tests: the cor stack's CI base image (the one coraine's own CI uses), the repos as
#     SIBLINGS under stack/ - corLibs' bootstrap.sh clones and builds the cor libs beside corCep
# Host networking: the broker notifies corCep on 127.0.0.1, as on a workstation.
#
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      #
      # Pinned, as in coraine's ci.yml: a red run is then a change in this repo, not in an image.
      #
      CI_IMAGE: quay.io/seamware/coraine-ci:2026-10-30-717882e
      CEP_BROKER_IMAGE: quay.io/seamware/coraine:0.7.0

    steps:
      - name: Check out corCep
        uses: actions/checkout@v4
        with:
          path: stack/corCep

      - name: Check out corLibs
        uses: actions/checkout@v4
        with:
          repository: SEAMWARE/corLibs
          path: stack/corLibs

      - name: Start the broker
        run: stack/corCep/test/funcTests/broker.sh up

      #
      # Release first (-O2 finds what -O0 does not), then the debug build the tests run on.
      # COR_LIBS_KEEP: bootstrap clones corCep too (corLibs#41) - here stack/corCep is this PR, leave it.
      # corTest sorts JSON bodies with the corJson tool and refuses to run without it - built by bootstrap.sh,
      # not on PATH in the image.
      #
      - name: Build the cor libs and corCep, run the functional tests
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/stack:/stack" -w /stack/corCep \
            -e CORJSON=/stack/corJson/bin/corJson \
            -e CEP_TEST_DIR=/stack/functest \
            "$CI_IMAGE" bash -c '
              set -e
              (cd ../corLibs && COR_LIBS_KEEP=corCep ./bootstrap.sh)
              make BUILD=release
              make clean
              make BUILD=debug
              ../corLibs/bin/corTest --noColor'

      - name: Stop the broker
        if: always()
        run: stack/corCep/test/funcTests/broker.sh down

      - name: Keep what a failing test left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functests
          path: |
            stack/corCep/test/funcTests/cases/*.out
            stack/corCep/test/funcTests/cases/*.diff
            stack/corCep/test/funcTests/cases/*.stderr
            stack/functest/

  #
  # The plugin form against coraine's main: THIS PR's cep.so inside a coraine built from main, the 38 plugin-form
  # tests (make functest-plugin). coraine's CI runs the same tests with corCep's main against ITS change; this job is
  # the other direction - a corCep change that breaks inside coraine (the bridge contract, the exported cor-lib
  # symbols coraine provides) is red here, not first in coraine's CI after the merge.
  #
  # The job IN the CI image (as coraine's own CI): bootstrap.sh installs the cor libs and, through the umbrella,
  # this checkout's cep.so (COR_LIBS_KEEP: stack/corCep is the PR); coraine main is built and installed with make di.
  #
  plugin-vs-coraine-main:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    container:
      image: quay.io/seamware/coraine-ci:2026-11-18-30e070f   # coraine's ci.yml's

    env:
      SEAMWARE_PLUGIN_DIR: /opt/seamware/plugins
      CORJSON: ${{ github.workspace }}/stack/corJson/bin/corJson

    steps:
      - name: Check out corCep
        uses: actions/checkout@v4
        with:
          path: stack/corCep

      - name: Check out corLibs
        uses: actions/checkout@v4
        with:
          repository: SEAMWARE-cor/corLibs
          path: stack/corLibs

      - name: Check out coraine (main)
        uses: actions/checkout@v4
        with:
          repository: SEAMWARE/coraine
          ref: main
          path: stack/coraine

      - name: Clone and build the cor stack
        working-directory: stack/corLibs
        run: COR_LIBS_KEEP=corCep ./bootstrap.sh

      - name: Build and install coraine
        working-directory: stack/coraine
        run: |
          mkdir -p /opt/seamware/plugins /opt/seamware/etc
          make di

      - name: The plugin-form tests (this cep.so in coraine main)
        timeout-minutes: 15
        working-directory: stack/corCep
        run: |
          sha=$(git -C ../coraine rev-parse --short HEAD)
          cmp /usr/local/bin/coraine ../coraine/BUILD_DEBUG/src/app/coraine/coraine
          echo "coraine main $sha: $(/usr/local/bin/coraine --version | head -1)"
          make functest-plugin CORTEST=$GITHUB_WORKSPACE/stack/corLibs/bin/corTest CORTEST_ARGS=--noColor \
               CEP_CORAINE=/usr/local/bin/coraine CEP_SEAMWARE_PLUGINS=/opt/seamware/plugins CEP_CORAINE_SHA=$sha

      - name: Keep what a failing test left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functests-plugin
          path: |
            stack/corCep/test/funcTests/cases/*.out
            stack/corCep/test/funcTests/cases/*.diff
            /tmp/corcep-functest/
            /tmp/corcep-plugin/coraine.log
